<!DOCTYPE html>
<html lang="en" style="background-color: #09090b;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERAU Dining Status</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Safari Dark Mode Style -->
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#09090b">
    <!-- Favicons -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Dining Status">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen px-4 py-6 font-sans antialiased max-w-md mx-auto" style="background-color: #09090b;">

    <!-- Header -->
    <header class="flex justify-between items-center mb-6 border-b border-zinc-800 pb-4">
        <div>
            <h1 class="text-xl font-bold tracking-tight">🍔 man im hungry</h1>
            <p class="text-xs text-zinc-400">(if you're reading this you trust me not to hack you)</p>
        </div>
        <div class="flex flex-col items-end">
            <button onclick="renderDiningStatus()" class="bg-zinc-800 hover:bg-zinc-700 text-xs px-3 py-1.5 rounded-lg font-medium transition">
                Refresh
            </button>
            <p id="current-time" class="text-xs text-zinc-400 mt-1">Loading time...</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="space-y-6">
        <!-- Open Now Section -->
        <section>
            <h2 class="text-sm font-semibold tracking-wider text-emerald-400 uppercase mb-3 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Open Now (Regular Hours)
            </h2>
            <div id="open-list" class="space-y-3">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- Closed Section -->
        <section>
            <h2 class="text-sm font-semibold tracking-wider text-zinc-400 uppercase mb-3">Closed / Coming Up</h2>
            <div id="closed-list" class="space-y-3">
                <!-- Injected via JS -->
            </div>
        </section>
    </main>

    <!-- Bottom Sheet Modal -->
    <div id="dining-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end justify-center transition-opacity duration-300 opacity-0 pointer-events-none" onclick="closeModal()">
        <div id="modal-content" class="bg-zinc-900 border-t border-zinc-800 w-full max-w-md rounded-t-2xl p-5 space-y-4 transform translate-y-full transition-transform duration-300 max-h-[85vh] overflow-y-auto shadow-2xl" onclick="event.stopPropagation()">
            <!-- Drag Handle Bar -->
            <div class="w-12 h-1.5 bg-zinc-700 rounded-full mx-auto mb-2"></div>
            
            <!-- Modal Header -->
            <div class="flex justify-between items-start">
                <div>
                    <h3 id="modal-title" class="text-lg font-bold text-white">Location Name</h3>
                    <p id="modal-location" class="text-xs text-emerald-400 font-medium mt-0.5">📍 Building Info</p>
                </div>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-white text-sm bg-zinc-800 px-2.5 py-1 rounded-lg">✕</button>
            </div>

            <!-- Light Image Preview -->
            <div id="modal-image-container" class="w-full h-36 bg-zinc-800 rounded-xl overflow-hidden relative flex items-center justify-center text-zinc-500 text-xs">
                <span>Loading Image...</span>
            </div>

            <!-- Description -->
            <p id="modal-desc" class="text-xs text-zinc-300 leading-relaxed">
                Loading Description...
            </p>

            <!-- Weekly Schedule Breakdown -->
            <div class="border-t border-zinc-800 pt-3">
                <h4 class="text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Weekly Hours</h4>
                <div id="modal-schedule" class="space-y-1.5 text-xs text-zinc-300">
                    <!-- Injected schedule rows -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- JavaScript Logic -->
    <script>
        // Descriptive metadata for locations (Location, Description)
        const LOCATION_METADATA = {
            "Chick-Fil-A": {
                location: "Student Union - Ground Floor",

                image: "https://images-prd.sodexomyway.net/web/en-us/media/DSC09384_tcm17-19451.JPG",

            "Qdoba": {

                image: "https://images-prd.sodexomyway.net/web/en-us/media/qdoba_tcm17-51132.jpg",

            "Refueling Station": {

                image: "https://images-prd.sodexomyway.net/web/en-us/media/20181003_SU_Dining_Refueling_Station-5661_tcm17-19440.jpg",
            },
            "Late Night": {
                location: "SU - Ground Floor (Inside of Refueling Station)",

                image: "https://images-prd.sodexomyway.net/web/en-us/media/20181003_SU_Dining_Refueling_Station-5661_tcm17-19440.jpg",
            },
            "Starbucks": {
                location: "Student Union - 2nd Floor",
                description: "It's an on-campus Starbucks! Enjoy your favorite high-quality whole bean coffees, rich-brewed, Italian style espresso beverages, premium Tazo Teas, pastries and confections, and coffee-related accessories and equipment.",
                image: "https://images-prd.sodexomyway.net/web/en-us/media/20181003_SU_Dining_Starbucks-5745_tcm17-19455.jpg",

            "Simple Servings": {

            },
            "Fuselage (off-campus)": {
                location: "2339 Beville Rd. Daytona Beach",
                description: "The Fuselage is located at the ERAU Information Technology Building and is available to the employees of ERAU Worldwide and the surrounding office locations. Fuselage offers a variety of fresh picks for breakfast and lunch, such as breakfast and lunch sandwhich options, bagels, salads and more.",
                image: "https://images-prd.sodexomyway.net/web/en-us/media/DSC00651_tcm17-19464.JPG",
            },
            "Virtual Dining Concept": {
                location: "Order on Grubhub / Pickup at Propellers",
                description: "Virtual dining offerings available for order exclusively through Grubhub for pickup at Propellers. Options include: Pardon My Cheese Steak, Ballpark Bites, Man-vs-Fries, loaded burritos, and bold flavors.",
                image: null,
            },
            "Food Hive (previously Eagle Mart)": {
                location: "Student Village - Ground Floor",
                description: "An on-campus convenience store with an array of snacks and drinks, microwaveable meals, toiletries, groceries, gifts and more.",
                image: "https://images-prd.sodexomyway.net/web/en-us/media/Food%20Hive_tcm17-93073.jpeg",
            },
            "Propellers": {
                location: "Student Union - Southwest Exterior",
                description: "Propellers features homemade burgers, grilled chicken caesar salads, fried potato wedges, fried chicken, soft serve ice cream and more. Stop by Propellers and find out why they call it \"the Best Burger on Campus.\"",
                image: "https://images-prd.sodexomyway.net/web/en-us/media/20211012_141829%20%283%29_tcm17-19445.jpg",
            },
            "Eagle Bites": {
                location: "Mobile; Usually in Front of the SU or CoAS",
                description: "A mobile cart offering convenient grab-and-go snacks, cold beverages, and rotating entrees. Perfect for students on the move between classes.",
                image: "https://images-prd.sodexomyway.net/web/en-us/media/IMG_4811_tcm17-73265.jpg",
            },
            "LW EATS Food Truck": {
                location: "Legacy Walk, Next to the College of Aviation",
                description: "Rotating food truck experience serving specialized street food lunches.",
                image: "https://images-prd.sodexomyway.net/web/en-us/media/Untitled%20design%20%2853%29_tcm17-19434.png",
            }
        };

        // ALL REGULAR HOURS
        const DINING_TIMES = [
            {name: "Flight Café", schedule: {0: [["07:00", "14:30"]], 1: [["07:00", "14:30"]], 2: [["07:00", "14:30"]], 3: [["07:00", "14:30"]], 4: [["07:00", "14:30"]], 5: [], 6: []}},
            {name: "Chick-Fil-A", schedule: {0: [["07:30", "21:00"]], 1: [["07:30", "21:00"]], 2: [["07:30", "21:00"]], 3: [["07:30", "21:00"]], 4: [["07:30", "18:00"]], 5: [["11:00", "18:00"]], 6: []}},
            {name: "Boundless Buffet", schedule: {0: [["07:00", "21:00"]], 1: [["07:00", "21:00"]], 2: [["07:00", "21:00"]], 3: [["07:00", "21:00"]], 4: [["07:00", "21:00"]], 5: [["09:00", "21:00"]], 6: [["09:00", "21:00"]]}},
            {name: "Fuselage (off-campus)", schedule: {0: [["08:00", "14:30"]], 1: [["08:00", "14:30"]], 2: [["08:00", "14:30"]], 3: [["08:00", "14:30"]], 4: [["08:00", "14:30"]], 5: [], 6: []}},
            {name: "Propellers", schedule: {0: [["10:30", "15:30"]], 1: [["10:30", "15:30"]], 2: [["10:30", "15:30"]], 3: [["10:30", "15:30"]], 4: [["10:30", "15:30"]], 5: [], 6: []}},
            {name: "Qdoba", schedule: {0: [["10:00", "19:00"]], 1: [["10:00", "19:00"]], 2: [["10:00", "19:00"]], 3: [["10:00", "19:00"]], 4: [["10:00", "19:00"]], 5: [], 6: [["10:00", "19:00"]]}},
            {name: "Refueling Station", schedule: {0: [["07:15", "21:00"]], 1: [["07:15", "21:00"]], 2: [["07:15", "21:00"]], 3: [["07:15", "21:00"]], 4: [["07:15", "19:00"]], 5: [["11:00", "19:00"]], 6: [["11:00", "19:00"]]}},
            {name: "Eagle Bites", schedule: {0: [["07:30", "09:30"], ["10:30", "13:00"]], 1: [["07:30", "09:30"], ["10:30", "13:00"]], 2: [["07:30", "09:30"], ["10:30", "13:00"]], 3: [["07:30", "09:30"], ["10:30", "13:00"]], 4: [["07:30", "09:30"], ["10:30", "13:00"]], 5: [], 6: []}},
            {name: "Late Night", schedule: {0: [["21:30", "02:00"]], 1: [["21:30", "02:00"]], 2: [["21:30", "02:00"]], 3: [["21:30", "02:00"]], 4: [["21:30", "02:00"]], 5: [["21:30", "02:00"]], 6: [["21:30", "02:00"]]}},
            {name: "Starbucks", schedule: {0: [["06:00", "22:00"]], 1: [["06:00", "22:00"]], 2: [["06:00", "22:00"]], 3: [["06:00", "22:00"]], 4: [["06:00", "18:00"]], 5: [["13:00", "18:00"]], 6: [["13:00", "22:00"]]}},
            {name: "Virtual Dining Concept", schedule: {0: [["17:30", "00:00"]], 1: [["17:30", "00:00"]], 2: [["17:30", "00:00"]], 3: [["17:30", "00:00"]], 4: [["17:30", "00:00"]], 5: [["17:30", "00:00"]], 6: [["17:30", "00:00"]]}},
            {name: "Simple Servings", schedule: {0: [["07:00", "14:30"], ["16:00", "21:00"]], 1: [["07:00", "14:30"], ["16:00", "21:00"]], 2: [["07:00", "14:30"], ["16:00", "21:00"]], 3: [["07:00", "14:30"], ["16:00", "21:00"]], 4: [["07:00", "14:30"], ["16:00", "21:00"]], 5: [["09:00", "14:30"], ["16:00", "21:00"]], 6: [["09:00", "14:30"], ["16:00", "21:00"]]}},
            {name: "Food Hive (previously Eagle Mart)", schedule: {0: [["12:00", "02:00"]], 1: [["12:00", "02:00"]], 2: [["12:00", "02:00"]], 3: [["12:00", "02:00"]], 4: [["12:00", "02:00"]], 5: [["12:00", "02:00"]], 6: [["12:00", "02:00"]]}},
            {name: "LW EATS Food Truck", schedule: {0: [["11:00", "15:00"]], 1: [["11:00", "15:00"]], 2: [["11:00", "15:00"]], 3: [["11:00", "15:00"]], 4: [["11:00", "15:00"]], 5: [], 6: []}}
        ];

        function makeTimePretty(timeStr) {
            if (timeStr == '12:00') return 'noon';
            if (timeStr == '00:00') return 'midnight';
            
            let [h, m] = timeStr.split(':').map(Number);
            let period = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${h}:${m.toString().padStart(2, '0')} ${period}`;
        }

        function openModal(name) {
            const item = DINING_DATA.find(d => d.name === name);
            const meta = LOCATION_METADATA[name] || {
                location: "Campus Dining Location",
                description: "No description available.",
                image: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop&q=60",
            };

            document.getElementById('modal-title').innerText = name;
            document.getElementById('modal-location').innerText = `📍 ${meta.location}`;
            document.getElementById('modal-desc').innerText = meta.description;
            
            // Image preview
            if (meta.image) {
                document.getElementById('modal-image-container').innerHTML = `
                    <img src="${meta.image}" alt="${name}" class="w-full h-full object-cover opacity-90">
                `;
                document.getElementById('modal-image-container').style.display = 'block';
            } else {
                document.getElementById('modal-image-container').style.display = 'none';
            }

            // Weekly schedule rows
            const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            let scheduleHTML = '';
            daysOfWeek.forEach((dayName, idx) => {
                let shifts = item.schedule[idx] || [];
                let shiftStr = shifts.length === 0 ? '<span class="text-zinc-500">Closed</span>' : shifts.map(s => `${makeTimePretty(s[0])} - ${makeTimePretty(s[1])}`).join(', ');
                scheduleHTML += `<div class="flex justify-between py-1 border-b border-zinc-800/40 text-[11px]"><span class="text-zinc-400">${dayName}</span><span class="font-medium text-right">${shiftStr}</span></div>`;
            });
            document.getElementById('modal-schedule').innerHTML = scheduleHTML;

            // Show Modal with Animation
            const modal = document.getElementById('dining-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('translate-y-full');
        }

        function closeModal() {
            const modal = document.getElementById('dining-modal');
            const content = document.getElementById('modal-content');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.add('translate-y-full');
        }

        function renderDiningStatus() {
            const now = new Date();
            const todayDay = (now.getDay() + 6) % 7; 
            const currentTimeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            document.getElementById('current-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let openHTML = '';
            let closedItems = [];

            DINING_DATA.forEach(item => {
                let shifts = item.schedule[todayDay] || [];
                let isOpen = false;
                let closingTimeStr = '';

                shifts.forEach(([openS, closeS]) => {
                    if (openS <= closeS) {
                        if (currentTimeStr >= openS && currentTimeStr <= closeS) {
                            isOpen = true;
                            closingTimeStr = closeS;
                        }
                    } else { 
                        if (currentTimeStr >= openS || currentTimeStr <= closeS) {
                            isOpen = true;
                            closingTimeStr = closeS;
                        }
                    }
                });

                if (isOpen) {
                    openHTML += `
                        <div onclick="openModal('${item.name}')" class="bg-zinc-900 hover:bg-zinc-850 border border-zinc-800 p-3.5 rounded-xl flex justify-between items-center cursor-pointer transition active:scale-[0.99]">
                            <div>
                                <h3 class="font-medium text-sm text-white">${item.name}</h3>
                                <p class="text-xs text-zinc-400">Open until ${makeTimePretty(closingTimeStr)}</p>
                            </div>
                            <span class="bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-medium border border-emerald-500/20">Open</span>
                        </div>`;
                } else {
                    let nextOpeningDt = null;
                    let minOpeningInMinutes = Infinity;

                    for (let offset = 0; offset < 8; offset++) {
                        let checkDay = (todayDay + offset) % 7;
                        let dayShifts = item.schedule[checkDay] || [];

                        for (let [openS, closeS] of dayShifts) {
                            let [oh, om] = openS.split(':').map(Number);
                            let candidate = new Date(now);
                            candidate.setDate(now.getDate() + offset);
                            candidate.setHours(oh, om, 0, 0);

                            if (candidate > now) {
                                let diffMins = Math.floor((candidate - now) / 60000);
                                if (diffMins < minOpeningInMinutes) {
                                    minOpeningInMinutes = diffMins;
                                    nextOpeningDt = candidate;
                                }
                            }
                        }
                        if (nextOpeningDt !== null) break;
                    }

                    closedItems.push({ name: item.name, nextOpeningDt, minOpeningInMinutes });
                }
            });

            // Sort closed locations with soonest to open at the top
            closedItems.sort((a, b) => a.minOpeningInMinutes - b.minOpeningInMinutes);

            let closedHTML = '';
            closedItems.forEach(item => {
                let timeStr = 'unknown';
                
                if (item.nextOpeningDt) {
                    // Calculate day difference to check if it's 2+ days away
                    const nowMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    const openingMidnight = new Date(item.nextOpeningDt.getFullYear(), item.nextOpeningDt.getMonth(), item.nextOpeningDt.getDate());
                    const dayDiff = Math.round((openingMidnight - nowMidnight) / (1000 * 60 * 60 * 24));

                    if (dayDiff === 1) {
                        // Tomorrow; show "closed until [time] tomorrow"
                        let rawTime = item.nextOpeningDt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                        if (rawTime === '12:00') {
                            timeStr = 'noon tomorrow';
                        } else if (rawTime === '00:00') {
                            timeStr = 'midnight tomorrow';
                        } else {
                            let formattedTime = item.nextOpeningDt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toLowerCase();
                            timeStr = `${formattedTime} tomorrow`;
                        }
                    } else if (dayDiff >= 2) {
                        // 2 or more days away; show the day of the week (e.g., "Monday")
                        timeStr = item.nextOpeningDt.toLocaleDateString([], { weekday: 'long' });
                    } else {
                        // Today; show the time (e.g., "10:00 am")
                        let rawTime = item.nextOpeningDt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                        if (rawTime === '12:00') {
                            timeStr = 'noon';
                        } else if (rawTime === '00:00') {
                            timeStr = 'midnight';
                        } else {
                            timeStr = item.nextOpeningDt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toLowerCase();
                        }
                    }
                }
                
                let hours = Math.floor(item.minOpeningInMinutes / 60);
                let mins = item.minOpeningInMinutes % 60;
                let timeRemStr = hours > 0 ? `${hours}h${mins}m` : `${mins}m`;

                // Color rules: > 60m = red, < 15m = yellow, otherwise = orange
                let colorClass = 'bg-orange-500/10 text-orange-400 border-orange-500/20';
                if (item.minOpeningInMinutes > 60) {
                    colorClass = 'bg-red-500/10 text-red-400 border-red-500/20';
                } else if (item.minOpeningInMinutes < 15) {
                    colorClass = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                }

                closedHTML += `
                    <div onclick="openModal('${item.name}')" class="bg-zinc-900/50 hover:bg-zinc-900 border border-zinc-800/60 p-3 rounded-xl flex justify-between items-center opacity-75 cursor-pointer transition active:scale-[0.99]">
                        <div>
                            <h3 class="font-medium text-sm text-zinc-300">${item.name}</h3>
                            <p class="text-xs text-zinc-500">Closed until ${timeStr}</p>
                        </div>
                        <span class="${colorClass} text-xs px-2.5 py-1 rounded-full font-medium border">Opens in ${timeRemStr}</span>
                    </div>`;
            });

            document.getElementById('open-list').innerHTML = openHTML || '<p class="text-xs text-zinc-500 italic">aw man... everything\'s closed :(</p>';
            document.getElementById('closed-list').innerHTML = closedHTML;
        }

        renderTrust = setInterval(renderDiningStatus, 30000);
        renderDiningStatus();
    </script>
</body>
</html>
